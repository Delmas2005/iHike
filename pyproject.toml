[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "ihike"
dynamic = ["version"]
description = "Real hike ideas from the map, anywhere in Europe"
readme = "README.md"
license = "Apache-2.0"
license-files = ["LICENSE"]
requires-python = ">=3.11,<3.12"
authors = [{ name = "Thomas Delmas" }]
classifiers = [
    "Programming Language :: Python :: 3.11",
    "Framework :: FastAPI",
    "Topic :: Scientific/Engineering :: GIS",
]
# Core: the web server and the planner. Ranges stay inside what gradio 5.49.1 accepts,
# because the Space installs gradio (its SDK) next to these.
dependencies = [
    "fastapi>=0.115.2,<1.0",
    "uvicorn>=0.30",
    "pydantic>=2.7,<2.12",
    "python-multipart>=0.0.18",
    "requests>=2.32,<3",
    "defusedxml>=0.7,<1",
    "pillow>=10.4,<12",
    "huggingface_hub>=0.33.5,<2",
]

[project.optional-dependencies]
# In-Space models: voice requests and species recognition. The app runs without them.
ai = [
    "faster-whisper>=1.1,<2",
    "torch>=2.4,<3",
    "open_clip_torch>=2.29,<4",
]
dev = [
    "pytest>=8.3",
    "pytest-cov>=5",
    "httpx>=0.27,<1",  # FastAPI's TestClient
    "ruff==0.17.3",
    "mypy>=1.13",
    "types-requests",
    "pre-commit>=4",
]

[project.urls]
Space = "https://huggingface.co/spaces/Monarch05/Monarch-hiking_space"
Source = "https://github.com/Delmas2005/iHike"

[tool.setuptools.dynamic]
version = { attr = "ihike.__version__" }

[tool.setuptools.packages.find]
include = ["ihike*"]

# ---------------------------------------------------------------- tests
[tool.pytest.ini_options]
testpaths = ["tests"]
pythonpath = [".", "tests"]
addopts = "-p no:cacheprovider"
filterwarnings = [
    # starlette's TestClient on recent anyio; not our code
    "ignore:The anyio.abc.BlockingPortal alias is deprecated:DeprecationWarning",
]

[tool.coverage.run]
source = ["ihike"]
branch = true

[tool.coverage.report]
show_missing = true
skip_covered = true

# ---------------------------------------------------------------- lint
[tool.ruff]
target-version = "py311"
line-length = 120
extend-exclude = ["static"]

[tool.ruff.lint]
select = [
    "E", "W",   # pycodestyle
    "F",        # pyflakes
    "I",        # import order
    "UP",       # pyupgrade
    "B",        # bugbear
    "S",        # bandit (security)
    "SIM",      # simplifications
    "RUF",      # ruff's own checks
]
ignore = [
    "S101",     # assert is fine in tests and for invariants
    "S104",     # binding 0.0.0.0 is what a Space needs
    "S311",     # random is not used for security
    "SIM108",   # ternaries are not always clearer
    "B905",     # zip() without strict=: the lengths are equal by construction
    "RUF005", "RUF007",  # list concatenation and zip(a, a[1:]) read fine
    "RUF001", "RUF002", "RUF003",  # typographic characters in French and English text are deliberate
]

[tool.ruff.lint.per-file-ignores]
"tests/**" = ["S105", "S106", "S108"]
"ihike/web.py" = ["B008"]  # File(...) and Form(...) defaults are how FastAPI declares uploads

[tool.ruff.lint.isort]
known-first-party = ["ihike", "fakes"]

# ---------------------------------------------------------------- types
[tool.mypy]
python_version = "3.11"
files = ["ihike", "app.py"]
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true
disallow_incomplete_defs = true

[[tool.mypy.overrides]]
module = ["faster_whisper.*", "open_clip.*", "torch.*", "defusedxml.*"]
ignore_missing_imports = true
